name: JOSM CI

on:
  push:
    branches:
      - Chung-Ping_Chen
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build + Run tests
        run: ant -Djava.awt.headless=true clean test